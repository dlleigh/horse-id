version: 0.2

# Define environment variables for the build process
env:
  variables:
    # Replace with your AWS account ID and desired region
    AWS_ACCOUNT_ID: "685175429625"
    AWS_DEFAULT_REGION: "us-east-2" # Or your specific region (e.g., us-east-1)

    # The name of your ECR repository where both images will be stored
    ECR_REPOSITORY_NAME: "horse-id-lambda-repo"

    # Image tags
    RESPONDER_IMAGE_TAG: "responder-latest"
    ML_WORKER_IMAGE_TAG: "ml-worker-latest"

    # Lambda function names to update after push
    RESPONDER_LAMBDA_NAME: "twilio-webhook-responder"
    ML_WORKER_LAMBDA_NAME: "horse-id-ml-worker"
    BACKEND_LAMBDA_NAME: "horse-id-backend"
    BACKEND_IMAGE_TAG: "backend-latest"

    # Frontend deployment
    FRONTEND_S3_BUCKET: "horse-id-frontend"
    CLOUDFRONT_DISTRIBUTION_ID: "PLACEHOLDER"
    VITE_NEON_AUTH_URL: "https://ep-shiny-shape-aj0git9l.neonauth.c-3.us-east-2.aws.neon.tech/neondb/auth"

phases:
  pre_build:
    commands:
      # Log in to Amazon ECR
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPOSITORY_NAME
      # Define the full URI for the ECR repository
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPOSITORY_NAME

  build:
    commands:
      - echo "Build started on $(date)"
      - echo "Building the twilio webhook responder Docker image..."
      # Build the responder image and tag it with its specific ECR URI
      - docker build --platform linux/amd64 --file Dockerfile.responder -t $ECR_REPOSITORY_NAME:$RESPONDER_IMAGE_TAG .
      - docker tag $ECR_REPOSITORY_NAME:$RESPONDER_IMAGE_TAG $REPOSITORY_URI:$RESPONDER_IMAGE_TAG

      - echo "Building the ML worker Docker image..."
      # Build the ML worker image (uses cloud/workers/Dockerfile with project-root build context)
      - docker build --platform linux/amd64 --file cloud/workers/Dockerfile -t $ECR_REPOSITORY_NAME:$ML_WORKER_IMAGE_TAG .
      - docker tag $ECR_REPOSITORY_NAME:$ML_WORKER_IMAGE_TAG $REPOSITORY_URI:$ML_WORKER_IMAGE_TAG

      - echo "Building the backend API Docker image..."
      - docker build --platform linux/amd64 --file cloud/backend/Dockerfile -t $ECR_REPOSITORY_NAME:$BACKEND_IMAGE_TAG cloud/backend
      - docker tag $ECR_REPOSITORY_NAME:$BACKEND_IMAGE_TAG $REPOSITORY_URI:$BACKEND_IMAGE_TAG

      - echo "Building frontend..."
      - cd cloud/frontend && npm ci && VITE_NEON_AUTH_URL=$VITE_NEON_AUTH_URL npm run build && cd ../..

  post_build:
    commands:
      - echo "Build completed on $(date)"
      - echo "Pushing Docker images to ECR..."
      - docker push $REPOSITORY_URI:$RESPONDER_IMAGE_TAG
      - docker push $REPOSITORY_URI:$ML_WORKER_IMAGE_TAG
      - docker push $REPOSITORY_URI:$BACKEND_IMAGE_TAG

      # Update Lambda functions to use the new images
      - echo "Updating Lambda functions..."
      - aws lambda update-function-code --function-name $RESPONDER_LAMBDA_NAME --image-uri $REPOSITORY_URI:$RESPONDER_IMAGE_TAG --region $AWS_DEFAULT_REGION
      - aws lambda update-function-code --function-name $ML_WORKER_LAMBDA_NAME --image-uri $REPOSITORY_URI:$ML_WORKER_IMAGE_TAG --region $AWS_DEFAULT_REGION
      - aws lambda update-function-code --function-name $BACKEND_LAMBDA_NAME --image-uri $REPOSITORY_URI:$BACKEND_IMAGE_TAG --region $AWS_DEFAULT_REGION
      - echo "Lambda functions updated."

      # Deploy frontend to S3 and invalidate CloudFront cache
      - echo "Deploying frontend to S3..."
      - aws s3 sync cloud/frontend/dist/ s3://$FRONTEND_S3_BUCKET --delete
      - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
      - echo "Frontend deployed."

artifacts:
  files: []
